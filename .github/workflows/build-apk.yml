name: Build APK

# Runs on every push, or when you press "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache + wrapper check)
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APKs (release + debug)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease assembleDebug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          MSG="$(grep -E '^e: |error:|What went wrong|> ' build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          echo "::error title=Build failed::${MSG:-see log}"

      - name: Collect the APKs
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DirectBubbles.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DirectBubbles-debug.apk
          ls -la out

      - name: Save the APK (Actions → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: DirectBubbles-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish the APK on the Releases page (direct download)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v1.24.${{ github.run_number }}" out/DirectBubbles.apk out/DirectBubbles-debug.apk \
            --target "${{ github.sha }}" \
            --latest \
            --title "Direct Bubbles v1.24.${{ github.run_number }}" \
            --notes "Built automatically from the latest code. On your phone, download **DirectBubbles.apk** below and open it to install or update (it installs over the previous version and keeps your settings)."
